set timeout=0
set default=0
set gfxmode=auto
set gfxpayload=keep
insmod all_video
insmod gfxterm
loadfont unicode
terminal_output gfxterm
insmod part_gpt
insmod part_msdos
insmod fat
insmod chain
insmod search
insmod search_fs_file
insmod loadenv

insmod regexp

# The kernel lives next to ICDAROOT.BIN (that is where OTA patches put it);
# older installs keep it on the EFI partition or under /BOOT.
# Another partition can carry ICDA files too (an earlier install); the
# system is first looked for where GRUB itself was loaded from, then on a
# partition with a complete system (its release file), and only then on any.
set icda_kernel=/EFI/ICDA/KERNEL.BIN
regexp --set=1:grub_dev '^\(([^)]+)\)' "$cmdpath"
if [ -n "$grub_dev" -a -f ($grub_dev)/ICDAROOT.BIN -a -f ($grub_dev)$icda_kernel ]; then
    set icda_root=$grub_dev
fi
if [ -z "$icda_root" ]; then
    search --no-floppy --file --set=icda_root /SYSTEM/etc/icda-release.txt
    if [ -n "$icda_root" ]; then
        if [ ! -f ($icda_root)$icda_kernel -o ! -f ($icda_root)/ICDAROOT.BIN ]; then
            unset icda_root
        fi
    fi
fi
if [ -z "$icda_root" ]; then
    search --no-floppy --file --set=icda_root /ICDAROOT.BIN
    if [ -n "$icda_root" ]; then
        if [ ! -f ($icda_root)$icda_kernel ]; then
            unset icda_root
        fi
    fi
fi
if [ -z "$icda_root" ]; then
    search --no-floppy --file --set=icda_root $icda_kernel
fi
if [ -z "$icda_root" ]; then
    set icda_kernel=/BOOT/KERNEL.BIN
    search --no-floppy --file --set=icda_root $icda_kernel
fi
set icda_prev=/UPDATE/BACKUP/EFI/ICDA/KERNEL.BIN
set icda_env=/EFI/ICDA/GRUBENV

search --no-floppy --file --set=win_root /EFI/Microsoft/Boot/bootmgfw.efi
search --no-floppy --file --set=ubuntu_root /EFI/ubuntu/shimx64.efi
# submenus start with a fresh environment: export what their entries use
export icda_root icda_kernel icda_prev icda_env win_root
if [ -n "$win_root" -o -n "$ubuntu_root" ]; then
    set timeout=5
    set timeout_style=menu
fi

# Boots ICDA with the given kernel arguments.  After an OTA patch the kernel
# sets icda_trial=1; the first boot turns it into 2 and a healthy desktop
# clears it.  Still 2 on the next boot means the patched system never came
# up: boot the previous kernel with icda_trial=3, which restores the backup.
function icda_boot {
    set root=$icda_root
    set kernel=$icda_kernel
    if [ -f ($icda_root)$icda_env ]; then
        load_env -f ($icda_root)$icda_env icda_trial
        if [ "$icda_trial" = "1" ]; then
            set icda_trial=2
            save_env -f ($icda_root)$icda_env icda_trial
        elif [ "$icda_trial" = "2" ]; then
            set icda_trial=3
            save_env -f ($icda_root)$icda_env icda_trial
            if [ -f ($icda_root)$icda_prev ]; then
                set kernel=$icda_prev
            fi
        fi
    fi
    multiboot2 $kernel $1 $2 $3
    boot
}

menuentry "ICDA" {
    icda_boot
}

submenu "ICDA troubleshooting" {
    menuentry "ICDA - show boot log" {
        icda_boot icda.verbose=1
    }
    menuentry "ICDA - show boot log, without Wi-Fi" {
        icda_boot icda.verbose=1 icda.nowifi=1
    }
    menuentry "ICDA - show boot log, one CPU" {
        icda_boot icda.verbose=1 icda.nosmp=1
    }
    menuentry "ICDA - show boot log, one CPU, without Wi-Fi" {
        icda_boot icda.verbose=1 icda.nosmp=1 icda.nowifi=1
    }
    if [ -f ($icda_root)$icda_prev ]; then
        menuentry "ICDA - previous version (before the last update)" {
            set root=$icda_root
            multiboot2 $icda_prev
            boot
        }
    fi
}

if [ -n "$win_root" ]; then
    menuentry "Windows Boot Manager" {
        set root=$win_root
        chainloader /EFI/Microsoft/Boot/bootmgfw.efi
    }
fi

if [ -n "$ubuntu_root" ]; then
    menuentry "Ubuntu" {
        set root=$ubuntu_root
        chainloader /EFI/ubuntu/shimx64.efi
    }
fi

menuentry "UEFI Firmware Settings" {
    fwsetup
}
