set timeout=0
set default=0
set gfxmode=auto
set gfxpayload=keep
insmod all_video
insmod gfxterm
terminal_output gfxterm
insmod part_gpt
insmod fat
insmod search
insmod search_fs_file

menuentry "ICDA" {
    search --file --set=root /boot/kernel.bin
    multiboot2 /boot/kernel.bin icda.live=1
    boot
}
