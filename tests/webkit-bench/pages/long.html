<!doctype html>
<!-- A long article and nothing else moving: scrolling it measures how soon
     a wheel notch reaches the screen (bench.py --env BENCH_TRACE=file). -->
<html><head><meta charset="utf-8"><title>Long article</title>
<style>
  body { margin: 0 auto; max-width: 760px; font: 17px/1.6 Georgia, serif; padding: 24px; color: #222; }
  h2 { font: 600 22px/1.3 sans-serif; margin-top: 2em; }
  .figure { height: 180px; border-radius: 8px; background: linear-gradient(135deg, #d9e6f7, #f3e3d3); }
</style></head>
<body>
  <h1>A long article</h1>
  <div id="text"></div>
  <script>
    const words = ("the window manager composites every visible window into one picture and sends it to the screen " +
      "a frame that changes nothing costs the same as one that does unless something notices the difference " +
      "pages scroll by whole wheel notches and each notch has to reach the screen before the next").split(" ");
    let html = "";
    for (let s = 1; s <= 60; s++) {
      html += "<h2>Section " + s + "</h2>";
      for (let p = 0; p < 4; p++) {
        let t = "";
        for (let w = 0; w < 70; w++) t += words[(s * 31 + p * 7 + w * 13) % words.length] + " ";
        html += "<p>" + t.charAt(0).toUpperCase() + t.slice(1, -1) + ".</p>";
      }
      if (s % 5 === 0) html += '<div class="figure"></div>';
    }
    document.getElementById("text").innerHTML = html;
  </script>
</body></html>
